  <h1>支持</h1>
  
  <h2>玩法</h2>
<ul><li>环顾房间,点按看起来有趣的地方进行调查。</li><li>找到的道具会放进物品栏。选中道具后,点按您认为可以使用的地方。</li><li>结合线索、解开谜题,从房间脱出。</li></ul>
<h2>提示</h2>
<p>卡关时请使用游戏内的提示功能。也建议检查是否还有没调查过的地方,并再看一遍物品栏。</p>
<h2>恢复购买</h2>
<p>如果您已购买“移除广告”,但更换设备或重新安装后仍出现广告,请在游戏中点按“恢复购买”。需使用购买时相同的 Apple ID 登录。</p>
