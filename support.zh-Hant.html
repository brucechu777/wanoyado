  <h1>支援</h1>
  
  <h2>玩法</h2>
<ul><li>環顧房間,點選看起來有趣的地方進行調查。</li><li>找到的道具會放進物品欄。選取道具後,點選您認為可以使用的地方。</li><li>結合線索、解開謎題,從房間脫出。</li></ul>
<h2>提示</h2>
<p>卡關時請使用遊戲內的提示功能。也建議檢查是否還有沒調查過的地方,並再看一次物品欄。</p>
<h2>恢復購買</h2>
<p>如果您已購買「移除廣告」,但更換裝置或重新安裝後仍出現廣告,請在遊戲中點選「恢復購買」。需使用購買時相同的 Apple ID 登入。</p>
<h2>聯絡我們</h2>
<p>問題或建議請寄至 <a href="mailto:zuyibo123@gmail.com">zuyibo123@gmail.com</a>,並附上裝置型號與 iOS 版本。</p>
